<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="80" fill="#0a0f1a"/>
  <defs>
    <linearGradient id="sg" x1="100" y1="60" x2="412" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield fill -->
  <path d="M256 60L420 120V240C420 340 348 430 256 460C164 430 92 340 92 240V120L256 60Z"
        fill="url(#sg)" fill-opacity="0.12"/>

  <!-- Shield stroke -->
  <path d="M256 60L420 120V240C420 340 348 430 256 460C164 430 92 340 92 240V120L256 60Z"
        stroke="url(#sg)" stroke-width="14" stroke-linejoin="round" fill="none"/>

  <!-- Checkmark -->
  <path d="M170 252L222 312L342 192"
        stroke="url(#sg)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
