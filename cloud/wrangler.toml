name = "agentshield-cloud"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[vars]
NEXT_PUBLIC_APP_URL = "https://agentshield-cloud.kshkrao3.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "agentshield-cloud"
database_id = "987ff628-c77d-492d-bda6-44f09e880fb3"
migrations_dir = "drizzle/migrations"

[[kv_namespaces]]
binding = "KV"
id = "29f3c1032a574f2581129a627e3c12cf"

[[r2_buckets]]
binding = "EVENT_LOGS"
bucket_name = "agentshield-event-logs"

# ----- Ingestion Worker (separate deployment) -----
# Run: pnpm worker:deploy
[env.ingest]
name = "agentshield-ingest"
main = "workers/ingest/index.ts"

[[env.ingest.d1_databases]]
binding = "DB"
database_name = "agentshield-cloud"
database_id = "987ff628-c77d-492d-bda6-44f09e880fb3"

[[env.ingest.kv_namespaces]]
binding = "KV"
id = "29f3c1032a574f2581129a627e3c12cf"

[[env.ingest.r2_buckets]]
binding = "EVENT_LOGS"
bucket_name = "agentshield-event-logs"
